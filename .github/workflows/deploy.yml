name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v7

      - name: Налаштувати Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Перевірити залежності на вразливості
        run: npm audit --audit-level=high

      - name: Перевірити стиль
        run: npm run lint

      - name: Запустити тести
        run: npm test

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Отримати код
        uses: actions/checkout@v7

      - name: Налаштувати Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Зібрати виробничу версію
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Налаштувати GitHub Pages
        uses: actions/configure-pages@v6

      - name: Завантажити артефакт Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опублікувати сайт
        id: deployment
        uses: actions/deploy-pages@v5
